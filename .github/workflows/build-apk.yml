
name: Build SmartDownloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3"

      - name: Prepare Buildozer configuration
        shell: bash
        run: |
          if ! grep -q '^p4a.branch' buildozer.spec; then
            echo 'p4a.branch = develop' >> buildozer.spec
          fi

          if ! grep -q '^android.accept_sdk_license' buildozer.spec; then
            echo 'android.accept_sdk_license = True' >> buildozer.spec
          fi

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDownloader-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

